name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch sqlite-vec extension
        run: ./scripts/fetch-sqlite-vec.sh
      - uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch-model.sh') }}
      - run: ./scripts/fetch-model.sh
      - name: Shared core tests + benchmark
        run: ./gradlew :core:jvmTest --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/
