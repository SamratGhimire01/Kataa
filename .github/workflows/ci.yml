name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch sqlite-vec extension
        run: ./scripts/fetch-sqlite-vec.sh
      - uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch-model.sh') }}
      - run: ./scripts/fetch-model.sh
      - name: Build native database for the host (same C code as the app)
        run: sudo apt-get install -y ninja-build && ./scripts/build-native-host.sh
      - name: Shared core tests + benchmark (native SQLCipher driver)
        run: ./gradlew :core:jvmTest --stacktrace
      - name: Shared core tests (sqlite-jdbc driver)
        run: ./gradlew :core:jvmTest -Pkataa.driver=jdbc --rerun-tasks --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch-model.sh') }}
      - name: Fetch model and native sources
        run: ./scripts/fetch-model.sh && ./scripts/fetch-native-sources.sh
      - name: Install NDK and platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-37.0" > /dev/null
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Check 16 KB alignment (Play requirement)
        run: |
          ZA=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/zipalign
          "$ZA" -c -P 16 -v 4 app/build/outputs/apk/release/app-release-unsigned.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: kataa-release-unsigned
          path: app/build/outputs/apk/release/*.apk
